<div
  class="log-form"
  style="z-index: 0; background-color: #f3f3f3"
  [ngStyle]="{
    opacity: isLoading ? 0.5 : 1,
    'pointer-events': isLoading ? 'none' : 'auto'
  }"
>
  <h2>Admin Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="custom-input-theme">
      <mat-label>Email</mat-label>
      <input
        matInput
        formControlName="email"
        name="email"
        autocomplete="off"
        class="custom-input-theme"
      />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password</mat-label>
      <input
        matInput
        formControlName="password"
        name="password"
        type="password"
      />
    </mat-form-field>
    <button mat-flat-button type="submit" class="btn">Login</button>
  </form>
</div>
@if(isLoading){
<app-buffer></app-buffer>
}
